version: '3.9'

services:
  db:
    image: postgres:15
    container_name: choralriff-db
    restart: always
    environment:
      POSTGRES_USER: choralriff
      POSTGRES_PASSWORD: choralriff
      POSTGRES_DB: choralriffdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
