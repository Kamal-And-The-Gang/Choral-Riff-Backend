# # # Ce fichier de configuration Yaml est librement inspiré de la ressource suivante
# # # https://qaautomation.expert/2023/06/26/how-to-run-springboot-tests-with-github-actions/
# # name: Compilation et test d'une application Web API Springboot

name: Compilation et test d'une application Web API Springboot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgresdb:
        image: postgres:17.2
        env:
          POSTGRES_USER: postgres
          # POSTGRES_PASSWORD: B@nLgU4qz*9?D~3n83
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: choralriffdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️⃣ Récupérer le code
      - uses: actions/checkout@v3

      # 2️⃣ Installer Java 21 et activer le cache Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      # 3️⃣ Attendre que PostgreSQL soit prêt
      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 5
          done
        env:
          # PGPASSWORD: B@nLgU4qz*9?D~3n83
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      #  Tester la connexion à la DB (optionnel mais utile)
      - name: Test DB connection
        run: |
          psql -h localhost -U postgres -d choralriffdb -c 'SELECT 1;'
        env:
          # PGPASSWORD: B@nLgU4qz*9?D~3n83
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Compiler et exécuter les tests
      - name: Compile and run tests
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/choralriffdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: dummy-password
          GROQ_API_KEY: dummy-key-for-ci

      # Afficher les rapports de tests si échec
      - name: Show Surefire test reports
        if: failure()
        run: |
          echo "=== Surefire reports ==="
          cat target/surefire-reports/*.txt || true