spring.application.name=choral-riff
spring.devtools.restart.enabled=false
server.port=8080

spring.datasource.url=jdbc:postgresql://postgresdb:5432/choralriffdb
spring.datasource.username=postgres
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret-key=${security.jwt.secret-key}
security.jwt.expiration-time-in-seconds=3600
security.jwt.refresh-expiration-time-in-seconds=604800

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${spring.mail.username}
spring.mail.password=${spring.mail.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
upload.dir=uploads